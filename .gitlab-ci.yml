stages:
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository

# Runs the whole suite against a Selenium standalone Chrome service container
test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  services:
    - name: selenium/standalone-chrome:latest
      alias: chrome
  variables:
    REMOTE_URL: "http://chrome:4444/wd/hub"
  script:
    - mvn -B test
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - target/allure-results
    reports:
      junit: target/surefire-reports/TEST-*.xml
